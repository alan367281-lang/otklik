# Проверки и выпуск.
#
# На каждый push и pull request — тесты и clippy на macOS и Windows.
# По метке версии (v*) — ещё и выпуск: подписанные установщики обеих систем,
# архив обновления для Mac и latest.json, по которому установленные
# программы узнают о новой версии и обновляются.
#
# Выпуск с меткой создаётся заранее (gh release create …) — сборка только
# докладывает в него файлы. Имена файлов латиницей и постоянные: GitHub
# портит кириллицу, а кнопки в README и latest.json ведут прямо на них.
name: Сборка

on:
  push:
    branches: [main, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Ключ подписи обновлений: без него программа не примет обновление.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # generate_context! ждёт собранное окно ещё при компиляции ядра.
      - run: npm run build:web

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Сборка (Apple Silicon + Intel)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: В выпуск
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$(ls $b/dmg/*.dmg | head -1)" Otklik_macOS.dmg
          cp "$(ls $b/macos/*.app.tar.gz | head -1)" Otklik_macOS.app.tar.gz
          cp "$(ls $b/macos/*.app.tar.gz.sig | head -1)" Otklik_macOS.app.tar.gz.sig
          gh release upload "$GITHUB_REF_NAME" Otklik_macOS.dmg Otklik_macOS.app.tar.gz Otklik_macOS.app.tar.gz.sig --clobber

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build:web

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Сборка установщика
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx tauri build --bundles nsis

      - name: В выпуск
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b=src-tauri/target/release/bundle/nsis
          cp "$(ls $b/*-setup.exe | head -1)" Otklik_Windows_setup.exe
          cp "$(ls $b/*-setup.exe.sig | head -1)" Otklik_Windows_setup.exe.sig
          gh release upload "$GITHUB_REF_NAME" Otklik_Windows_setup.exe Otklik_Windows_setup.exe.sig --clobber

  # Когда обе сборки в выпуске — собрать latest.json: версия, что нового,
  # для каждой системы — адрес файла и его подпись.
  latest-json:
    name: latest.json для обновлений
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать и выложить
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p '*.sig' -D sigs
          gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.txt
          node - <<'EOF'
          const fs = require('fs')
          const tag = process.env.GITHUB_REF_NAME
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`
          const version = require('./src-tauri/tauri.conf.json').version
          const sig = (f) => fs.readFileSync(`sigs/${f}`, 'utf8').trim()
          const mac = { signature: sig('Otklik_macOS.app.tar.gz.sig'), url: `${base}/Otklik_macOS.app.tar.gz` }
          const json = {
            version,
            notes: fs.readFileSync('notes.txt', 'utf8').trim(),
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': { signature: sig('Otklik_Windows_setup.exe.sig'), url: `${base}/Otklik_Windows_setup.exe` },
              'darwin-aarch64': mac,
              'darwin-x86_64': mac,
            },
          }
          fs.writeFileSync('latest.json', JSON.stringify(json, null, 2))
          EOF
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
